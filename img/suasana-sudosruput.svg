<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <!-- Gradien Dinding & Plafon Kayu Hangat -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b160a" />
      <stop offset="45%" stop-color="#472613" />
      <stop offset="100%" stop-color="#241208" />
    </linearGradient>

    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#361c0e" />
      <stop offset="100%" stop-color="#170b05" />
    </linearGradient>

    <!-- Gradien Kayu Meja Bar & Furnitur -->
    <linearGradient id="woodBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#874f2b" />
      <stop offset="25%" stop-color="#6b3c1e" />
      <stop offset="100%" stop-color="#3d200e" />
    </linearGradient>

    <linearGradient id="woodTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9e6036" />
      <stop offset="50%" stop-color="#b87344" />
      <stop offset="100%" stop-color="#854e29" />
    </linearGradient>

    <!-- Gradien Cahaya Lampu Gantung (Warm Glow) -->
    <radialGradient id="lampGlow" cx="50%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#ffdfa0" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#f5a642" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#f5a642" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e3" />
      <stop offset="50%" stop-color="#ffd175" />
      <stop offset="100%" stop-color="#f0932b" stop-opacity="0" />
    </radialGradient>

    <!-- Gradien Jendela Senja/Hangat di Sisi Kiri -->
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd699" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8c4a20" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- 1. Latar Belakang Dinding & Lantai Kayu -->
  <rect width="800" height="385" fill="url(#wallGrad)" />
  <rect y="385" width="800" height="115" fill="url(#floorGrad)" />
  <line x1="0" y1="385" x2="800" y2="385" stroke="#1c0d06" stroke-width="4" />

  <!-- Panel Dinding Kayu Vertikal (Aksen Interior Kafe) -->
  <g stroke="#291409" stroke-width="2" opacity="0.55">
    <line x1="160" y1="0" x2="160" y2="385" />
    <line x1="220" y1="0" x2="220" y2="385" />
    <line x1="280" y1="0" x2="280" y2="385" />
    <line x1="340" y1="0" x2="340" y2="385" />
    <line x1="400" y1="0" x2="400" y2="385" />
    <line x1="460" y1="0" x2="460" y2="385" />
    <line x1="520" y1="0" x2="520" y2="385" />
    <line x1="580" y1="0" x2="580" y2="385" />
    <line x1="640" y1="0" x2="640" y2="385" />
  </g>

  <!-- Balok Plafon Kayu Atas (Nuansa Joglo / Kayu Tradisional Modern) -->
  <rect width="800" height="26" fill="#241107" stroke="#140903" stroke-width="2" />
  <rect x="115" y="0" width="24" height="385" fill="#2e160a" stroke="#170a04" stroke-width="2" />
  <rect x="665" y="0" width="24" height="385" fill="#2e160a" stroke="#170a04" stroke-width="2" />

  <!-- 2. Jendela Kisi Kayu di Sisi Kiri -->
  <g>
    <rect x="24" y="65" width="76" height="200" rx="4" fill="#3d2110" stroke="#1c0d06" stroke-width="3" />
    <rect x="30" y="71" width="64" height="188" fill="url(#windowGlow)" />
    <!-- Siluet Tanaman Luar Jendela -->
    <circle cx="52" cy="215" r="24" fill="#4f3318" opacity="0.5" />
    <circle cx="76" cy="230" r="20" fill="#3d2510" opacity="0.6" />
    <!-- Kisi-kisi Kayu Jendela -->
    <line x1="62" y1="65" x2="62" y2="265" stroke="#241107" stroke-width="4" />
    <line x1="24" y1="130" x2="100" y2="130" stroke="#241107" stroke-width="4" />
    <line x1="24" y1="195" x2="100" y2="195" stroke="#241107" stroke-width="4" />
  </g>

  <!-- 3. Papan Menu & Rak Kayu di Dinding Tengah -->
  <!-- Papan Nama / Menu Kayu -->
  <g transform="translate(275, 118)">
    <rect width="250" height="86" rx="6" fill="#241208" stroke="#8c542e" stroke-width="3" />
    <rect x="6" y="6" width="238" height="74" rx="3" fill="none" stroke="#593219" stroke-width="1.5" />
    <text x="125" y="42" font-family="&#39;Trebuchet MS&#39;, &#39;Segoe UI&#39;, sans-serif" font-size="22" font-weight="800" fill="#f7e3c6" text-anchor="middle" letter-spacing="1.5">
      SUDO SRUPUT
    </text>
    <line x1="55" y1="52" x2="195" y2="52" stroke="#8c542e" stroke-width="1.5" />
    <text x="125" y="69" font-family="&#39;Trebuchet MS&#39;, &#39;Segoe UI&#39;, sans-serif" font-size="11" font-weight="600" fill="#d9b282" text-anchor="middle" letter-spacing="2">
      MANUAL BREW • ESPRESSO • KOPI SUSU
    </text>
  </g>

  <!-- Rak Kayu Kiri (Toples Biji Kopi & Tanaman Gantung) -->
  <g>
    <rect x="165" y="165" width="90" height="8" rx="2" fill="#784423" stroke="#241107" stroke-width="2" />
    <!-- Toples Kopi -->
    <rect x="176" y="137" width="20" height="28" rx="3" fill="#c49a6c" opacity="0.85" stroke="#241107" stroke-width="1.8" />
    <rect x="178" y="133" width="16" height="5" rx="1" fill="#4a2711" />
    <rect x="202" y="142" width="18" height="23" rx="3" fill="#a87948" opacity="0.85" stroke="#241107" stroke-width="1.8" />
    <rect x="204" y="138" width="14" height="5" rx="1" fill="#4a2711" />
    <!-- Pot Tanaman Kecil -->
    <path d="M 230 150 L 246 150 L 243 165 L 233 165 Z" fill="#9c5230" stroke="#241107" stroke-width="1.8" />
    <path d="M 238 150 C 230 138 222 142 225 148 M 238 150 C 245 136 254 140 250 148 M 238 150 C 236 134 242 134 240 148" fill="none" stroke="#5e7a42" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Rak Kayu Kanan (Cangkir Keramik & Teko Leher Angsa) -->
  <g>
    <rect x="545" y="165" width="95" height="8" rx="2" fill="#784423" stroke="#241107" stroke-width="2" />
    <!-- Tumpukan Cangkir -->
    <rect x="556" y="149" width="18" height="16" rx="3" fill="#f5ede1" stroke="#241107" stroke-width="1.8" />
    <rect x="558" y="135" width="16" height="14" rx="3" fill="#e6dac8" stroke="#241107" stroke-width="1.8" />
    <!-- Teko Gooseneck (Pour Over Kettle) -->
    <path d="M 596 165 L 601 143 L 617 143 L 622 165 Z" fill="#d1c7b8" stroke="#241107" stroke-width="1.8" />
    <path d="M 598 158 C 587 156 588 142 583 141" fill="none" stroke="#d1c7b8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 620 146 C 628 146 628 159 621 159" fill="none" stroke="#241107" stroke-width="2.2" />
  </g>

  <!-- 4. Pancaran Cahaya Hangat dari 3 Lampu Gantung -->
  <polygon points="220,92 80,385 360,385" fill="url(#lampGlow)" />
  <polygon points="400,92 240,385 560,385" fill="url(#lampGlow)" />
  <polygon points="580,92 440,385 720,385" fill="url(#lampGlow)" />

  <!-- 5. Meja Bar Kopi Utama (Kayu Hangat) -->
  <g>
    <!-- Badan Meja Bar -->
    <rect x="150" y="275" width="500" height="125" fill="url(#woodBarGrad)" stroke="#1f0e06" stroke-width="3" />
    <!-- Panel Kayu Horizontal di Depan Meja Bar -->
    <rect x="166" y="294" width="468" height="90" rx="4" fill="#522c15" stroke="#2e1609" stroke-width="2" />
    <line x1="166" y1="324" x2="634" y2="324" stroke="#361a0b" stroke-width="2.5" />
    <line x1="166" y1="354" x2="634" y2="354" stroke="#361a0b" stroke-width="2.5" />

    <!-- Permukaan Atas Meja Bar (Countertop Kayu Tebal) -->
    <rect x="138" y="264" width="524" height="15" rx="4" fill="url(#woodTopGrad)" stroke="#1f0e06" stroke-width="2.5" />
  </g>

  <!-- 6. Peralatan Barista di Atas Meja Bar -->
  <!-- Mesin Espresso Klasik (Kiri) -->
  <g transform="translate(185, 204)">
    <rect width="74" height="60" rx="5" fill="#d9cfc1" stroke="#241107" stroke-width="2.5" />
    <rect x="6" y="8" width="62" height="18" rx="2" fill="#8c542e" />
    <!-- Portafilter & Grouphead -->
    <rect x="26" y="26" width="22" height="10" fill="#4a423b" />
    <line x1="37" y1="32" x2="56" y2="36" stroke="#241107" stroke-width="4" stroke-linecap="round" />
    <!-- Drip Tray -->
    <rect x="8" y="53" width="58" height="7" fill="#595047" />
    <!-- Cangkir di bawah mesin -->
    <rect x="30" y="42" width="14" height="11" rx="2" fill="#ffffff" stroke="#241107" stroke-width="1.5" />
  </g>

  <!-- Grinder Kopi (Tengah Kiri) -->
  <g transform="translate(274, 212)">
    <rect x="6" y="22" width="26" height="30" rx="3" fill="#422413" stroke="#241107" stroke-width="2" />
    <!-- Hopper Biji Kopi -->
    <polygon points="4,4 34,4 26,22 12,22" fill="#8c5832" opacity="0.85" stroke="#241107" stroke-width="2" />
    <rect x="2" y="1" width="34" height="4" rx="1" fill="#241107" />
  </g>

  <!-- Alat Seduh V60 / Manual Brew (Tengah Kanan) -->
  <g transform="translate(475, 224)">
    <!-- Server Kaca Kopi -->
    <path d="M 8 22 L 28 22 L 33 40 L 3 40 Z" fill="#e8dfd3" opacity="0.75" stroke="#241107" stroke-width="2" />
    <path d="M 5 30 L 31 30 L 33 40 L 3 40 Z" fill="#5c2d12" />
    <!-- Dripper V60 Keramik -->
    <polygon points="4,8 32,8 23,22 13,22" fill="#fcf8f2" stroke="#241107" stroke-width="2" />
  </g>

  <!-- Secangkir Kopi Hangat Sudo Sruput di Atas Meja Bar (Kanan) -->
  <g transform="translate(532, 232)">
    <!-- Saucer -->
    <ellipse cx="26" cy="30" rx="24" ry="4.5" fill="#e6dccd" stroke="#241107" stroke-width="1.8" />
    <!-- Cangkir -->
    <path d="M 10 12 C 10 24 15 29 26 29 C 37 29 42 24 42 12 Z" fill="#fcf8f2" stroke="#241107" stroke-width="2" />
    <path d="M 41 15 C 49 15 49 24 40 24" fill="none" stroke="#fcf8f2" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 41 15 C 49 15 49 24 40 24" fill="none" stroke="#241107" stroke-width="1.5" stroke-linecap="round" />
    <!-- Uap Tipis -->
    <path d="M 22 7 Q 19 1 23 -4" fill="none" stroke="#fff3db" stroke-width="1.8" stroke-linecap="round" opacity="0.65" />
    <path d="M 29 7 Q 32 1 28 -4" fill="none" stroke="#fff3db" stroke-width="1.8" stroke-linecap="round" opacity="0.65" />
  </g>

  <!-- 7. Tiga Kursi Bar Kayu (Bar Stools) di Depan Meja -->
  <!-- Kursi 1 -->
  <g transform="translate(215, 342)">
    <line x1="14" y1="10" x2="6" y2="75" stroke="#2b1509" stroke-width="5" stroke-linecap="round" />
    <line x1="46" y1="10" x2="54" y2="75" stroke="#2b1509" stroke-width="5" stroke-linecap="round" />
    <line x1="10" y1="45" x2="50" y2="45" stroke="#472410" stroke-width="4" />
    <rect x="4" y="0" width="52" height="11" rx="5" fill="#8f542e" stroke="#1f0e06" stroke-width="2.2" />
  </g>

  <!-- Kursi 2 -->
  <g transform="translate(370, 342)">
    <line x1="14" y1="10" x2="6" y2="75" stroke="#2b1509" stroke-width="5" stroke-linecap="round" />
    <line x1="46" y1="10" x2="54" y2="75" stroke="#2b1509" stroke-width="5" stroke-linecap="round" />
    <line x1="10" y1="45" x2="50" y2="45" stroke="#472410" stroke-width="4" />
    <rect x="4" y="0" width="52" height="11" rx="5" fill="#8f542e" stroke="#1f0e06" stroke-width="2.2" />
  </g>

  <!-- Kursi 3 -->
  <g transform="translate(525, 342)">
    <line x1="14" y1="10" x2="6" y2="75" stroke="#2b1509" stroke-width="5" stroke-linecap="round" />
    <line x1="46" y1="10" x2="54" y2="75" stroke="#2b1509" stroke-width="5" stroke-linecap="round" />
    <line x1="10" y1="45" x2="50" y2="45" stroke="#472410" stroke-width="4" />
    <rect x="4" y="0" width="52" height="11" rx="5" fill="#8f542e" stroke="#1f0e06" stroke-width="2.2" />
  </g>

  <!-- 8. Tanaman Indoor Hangat di Pojok Kanan -->
  <g transform="translate(715, 295)">
    <!-- Pot Kayu / Terakota -->
    <polygon points="8,45 48,45 42,90 14,90" fill="#7a3e20" stroke="#1f0e06" stroke-width="2.5" />
    <rect x="5" y="40" width="46" height="7" rx="2" fill="#944d29" stroke="#1f0e06" stroke-width="2" />
    <!-- Daun Monstera / Palem -->
    <path d="M 28 40 C 10 20 2 5 16 -10 C 26 2 28 22 28 40 Z" fill="#4e6b34" stroke="#1f0e06" stroke-width="2" />
    <path d="M 28 40 C 46 20 56 5 42 -12 C 32 0 28 22 28 40 Z" fill="#3d5727" stroke="#1f0e06" stroke-width="2" />
    <path d="M 28 40 C 24 12 26 -15 30 -24 C 35 -12 32 15 28 40 Z" fill="#5e7d40" stroke="#1f0e06" stroke-width="2" />
  </g>

  <!-- 9. Tiga Lampu Gantung Kap Kayu/Rotan (Pendant Lamps) -->
  <!-- Lampu Kiri -->
  <g>
    <line x1="220" y1="0" x2="220" y2="62" stroke="#170a04" stroke-width="3" />
    <circle cx="220" cy="88" r="22" fill="url(#bulbGlow)" />
    <circle cx="220" cy="86" r="7" fill="#fff7e0" />
    <path d="M 192 86 C 192 64 248 64 248 86 Z" fill="#7d4724" stroke="#1f0e06" stroke-width="2.5" />
  </g>

  <!-- Lampu Tengah -->
  <g>
    <line x1="400" y1="0" x2="400" y2="54" stroke="#170a04" stroke-width="3" />
    <circle cx="400" cy="82" r="26" fill="url(#bulbGlow)" />
    <circle cx="400" cy="80" r="8" fill="#fff7e0" />
    <path d="M 368 80 C 368 56 432 56 432 80 Z" fill="#8f522b" stroke="#1f0e06" stroke-width="2.5" />
  </g>

  <!-- Lampu Kanan -->
  <g>
    <line x1="580" y1="0" x2="580" y2="62" stroke="#170a04" stroke-width="3" />
    <circle cx="580" cy="88" r="22" fill="url(#bulbGlow)" />
    <circle cx="580" cy="86" r="7" fill="#fff7e0" />
    <path d="M 552 86 C 552 64 608 64 608 86 Z" fill="#7d4724" stroke="#1f0e06" stroke-width="2.5" />
  </g>
</svg>